# Replace this template with SealedSecret output in production.
# Never commit a real database password or API token.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: shop
type: Opaque
stringData:
  POSTGRES_USER: appuser
  POSTGRES_PASSWORD: replace-in-secret-manager
  POSTGRES_DB: shopdb
  DATABASE_URL: postgres://appuser:replace-in-secret-manager@postgres:5432/shopdb
---
apiVersion: v1
kind: Secret
metadata:
  name: shop-api
  namespace: shop
type: Opaque
stringData:
  SHOP_API_TOKEN: replace-with-a-long-random-token
